# XcodeGen-projekt. Generér Xcode-projektet med:  xcodegen generate
# (installér først med:  brew install xcodegen)
name: LinkTunnel

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: da

settings:
  base:
    # ↓↓↓ Ret disse to linjer ↓↓↓
    BUNDLE_PREFIX: dk.jayh            # dit omvendte domæne – bundle-id'er bliver fx dk.jayh.LinkTunnel
    DEVELOPMENT_TEAM: ""              # dit Team ID fra developer.apple.com (eller vælg team i Xcode)
    # ↑↑↑
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  LinkTunnel:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared/Swift
      - path: Shared/UI
      - path: Shared/linktunnel-core.js
        buildPhase: resources
    dependencies:
      - target: LinkTunnelSafari
      - target: LinkTunnelAction
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LinkTunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: LinkTunnel
            CFBundleURLSchemes: [linktunnel]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true   # nødvendigt for at følge omdirigeringer fra http-links
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).LinkTunnel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  LinkTunnelSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariExtension
      - path: Shared/Swift
      - path: Shared/linktunnel-core.js
        buildPhase: resources
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: LinkTunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).LinkTunnel.Safari
        APPLICATION_EXTENSION_API_ONLY: YES

  LinkTunnelAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ActionExtension
      - path: Shared/Swift
      - path: Shared/UI
      - path: Shared/linktunnel-core.js
        buildPhase: resources
    info:
      path: ActionExtension/Info.plist
      properties:
        CFBundleDisplayName: Tjek med LinkTunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActionViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).LinkTunnel.Action
        APPLICATION_EXTENSION_API_ONLY: YES
